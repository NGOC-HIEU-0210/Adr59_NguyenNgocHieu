quarkus.application.name=Quarkus_Core
quarkus.http.port=8080
# URL cua Python AI service (tuong duong python.service.url trong application.yaml cua Spring)
python.service.url=http://localhost:8000/api/v1/extract-math
# Gioi han dung luong upload/multipart, tuong duong 10MB o ban Spring
quarkus.http.limits.max-body-size=10M
quarkus.vertx.max-body-size=10M
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h "%r" %s %b "%{i,Content-Type}" "%{i,Content-Length}" "%{i,Host}" "%{i,User-Agent}" "%{i,Accept-Encoding}" "%{i,Connection}"
quarkus.log.category."io.vertx".level=DEBUG
quarkus.log.category."org.jboss.resteasy.reactive.server".level=DEBUG
quarkus.http.host=0.0.0.0